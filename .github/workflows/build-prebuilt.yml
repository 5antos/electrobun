name: Build Prebuilt Artifacts

# Publishes prebuilt native binaries (CLI + core) as a GitHub Release on this
# fork, so consumers can depend on a lightweight, pre-built package (like the
# real npm-published electrobun) instead of building from source on every
# install.
#
# workflow_dispatch would be cleaner (this fork changes rarely, no need to
# rebuild on every push) but GitHub only lets you dispatch a workflow that
# already exists on the repo's default branch - this fork's default branch
# is main, untouched upstream code, and this workflow only lives on this
# fix branch. Trigger on push here instead; switch to workflow_dispatch
# once this file is merged to main.

on:
  push:
    branches:
      - fix/windows-per-monitor-dpi-awareness
    paths:
      - .github/workflows/build-prebuilt.yml
      - "package/**"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: windows-2025
            platform: win
            arch: x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: package

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Replace Git Bash tar with Windows tar
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $gitTar = "C:\Program Files\Git\usr\bin\tar.exe"
          $winTar = "C:\Windows\System32\tar.exe"
          if (Test-Path $gitTar) {
            Rename-Item $gitTar "${gitTar}.original" -Force
            New-Item -ItemType SymbolicLink -Path $gitTar -Target $winTar
          }

      - name: Ensure cmake is available (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          if ! command -v cmake &> /dev/null; then
            choco install cmake -y
          fi

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Package release
        run: bun scripts/package-release.js
        shell: bash

      - name: Restore Git Bash tar
        if: matrix.platform == 'win'
        shell: cmd
        run: |
          del "C:\Program Files\Git\usr\bin\tar.exe"
          ren "C:\Program Files\Git\usr\bin\tar.exe.original" tar.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-${{ matrix.platform }}-${{ matrix.arch }}
          path: package/electrobun-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Determine version and tag
        id: tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package/package.json').version")
          echo "Version detected: $VERSION"
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*.tar.gz
          generate_release_notes: false
          prerelease: true
          body: |
            Prebuilt electrobun binaries for the Windows per-monitor DPI awareness fix fork.
